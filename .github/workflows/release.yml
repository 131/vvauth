name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  vauth:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build vauth (linux/amd64, windows/amd64)
        run: |
          mkdir -p output
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o output/vauth-linux-amd64 ./cmd/vauth
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o output/vauth-windows-amd64.exe ./cmd/vauth
      - name: Sign vauth-windows-amd64.exe
        env:
          SIGNING_SERVER: ${{ secrets.SIGNING_SERVER }}
        run: |
          if [ -z "${SIGNING_SERVER:-}" ]; then echo "No signing server defined, binary left unsigned"; exit 0; fi
          file=output/vauth-windows-amd64.exe
          response=$(curl -s -X PUT --data-binary @- -D - -o "$file.signed" "$SIGNING_SERVER" < "$file" | sed 's/\r$//')
          echo "$response" | grep -qe "HTTP/1.. 200 " || { echo "Could not sign $file"; exit 1; }
          mv "$file.signed" "$file"
          echo "$file successfully signed."
      - run: (cd output && sha256sum vauth-* > SHA256SUMS)
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: output/*
          file_glob: true
          tag: ${{ github.ref }}
