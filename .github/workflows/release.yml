name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  vauth:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build vauth (linux/amd64, windows/amd64)
        run: |
          mkdir -p output
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o output/vauth-linux-amd64 ./cmd/vauth
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o output/vauth-windows-amd64.exe ./cmd/vauth
      - uses: 131/gh-actions/sign-binaries@v1
        with:
          files: output/*.exe
          signing-server: ${{ secrets.SIGNING_SERVER }}
      - run: (cd output && sha256sum vauth-* > SHA256SUMS)
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: output/*
          file_glob: true
          tag: ${{ github.ref }}
