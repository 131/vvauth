name: test
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm install
      - run: npm run eslint
      - run: npm test

  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows runners ship Git with core.autocrlf=true, which would turn LF sources into CRLF
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . && test -z "$(gofmt -l .)"
        shell: bash
      - run: go vet ./...
      - run: go test ./...
        if: runner.os == 'Linux'
      - run: go build ./cmd/vauth
        if: runner.os == 'Windows'
